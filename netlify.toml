[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "/api/v1"

[[redirects]]
  from = "/api/*"
  to = "https://northassess-proctoring-system.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
