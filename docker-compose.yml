services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proctoring}
      POSTGRES_USER: ${POSTGRES_USER:-proctoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proctoring} -d ${POSTGRES_DB:-proctoring}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://proctoring:local-development-only@db:5432/proctoring}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-secret-change-before-deployment-000000000000}
      JWT_ISSUER: ${JWT_ISSUER:-northstar-assess}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://vision:8787}
      VISION_INTERNAL_API_KEY: ${VISION_INTERNAL_API_KEY:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

  vision:
    profiles: ["vision"]
    build:
      context: ./ml/vision
    environment:
      VISION_MODEL_PATH: /models/detector.joblib
      VISION_INTERNAL_API_KEY: ${VISION_INTERNAL_API_KEY:-}
    volumes:
      - ${VISION_MODEL_FILE:-./artifacts/vision/zenodo-students-online-exam-v1/hog-svm-grouped-seed42-v3/detector.joblib}:/models/detector.joblib:ro
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/v1/health/ready')"]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  postgres_data:
